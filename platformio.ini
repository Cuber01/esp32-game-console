[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags = -std=gnu++17
upload_protocol = jlink
debug_tool = jlink
debug_speed = 4000
debug_init_break = tbreak setup
build_type = debug

define_targets =

debug_extra_cmds =
    mon reset halt

openocd_args =
    -c "set WORKAREASIZE 0x4000"
    -c "gdb_memory_map disable"
    -c "reset_config srst_only"
